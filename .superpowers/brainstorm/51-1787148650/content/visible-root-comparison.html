<h2>作品名称要不要成为树中的第一行？</h2>
<p class="subtitle">两种方案的数据都可以有同一个根容器，区别主要在用户界面是否把它显示成树节点。</p>

<div class="cards">
  <div class="card" data-choice="visible-root" onclick="toggleSelect(this)">
    <div class="card-image" style="padding:22px;background:#f6f7f8;min-height:310px">
      <div style="font-weight:700;font-size:18px;margin-bottom:16px">作品结构</div>
      <div style="border:1px solid #9aa0a6;background:white;padding:14px;font-family:Consolas,monospace;line-height:2">
        <div style="font-weight:700;background:#e8eef5;padding:0 8px">▾ 我的故事 <span style="font:12px Segoe UI;color:#68707a">作品根节点</span></div>
        <div style="padding-left:28px">▾ 角色设定 <span style="font:12px Segoe UI;color:#68707a">文件夹</span></div>
        <div style="padding-left:56px">▤ 林的人物小传</div>
        <div style="padding-left:28px">▤ 未命名文档</div>
      </div>
      <div style="margin-top:14px;color:#68707a;font-size:13px">“我的故事”出现在树中，但不能移动、删除，也不是普通文件夹。</div>
    </div>
    <div class="card-body"><h3>A · 显示作品根节点</h3><p>作品名称既是页面所属对象，也是树中的第一行。</p></div>
  </div>

  <div class="card" data-choice="hidden-root" onclick="toggleSelect(this)">
    <div class="card-image" style="padding:22px;background:#f6f7f8;min-height:310px">
      <div style="display:flex;justify-content:space-between;align-items:end;margin-bottom:16px">
        <div><div style="font-size:12px;color:#68707a">当前作品</div><div style="font-weight:700;font-size:18px">我的故事</div></div>
        <div style="font-size:13px;color:#68707a">作品结构</div>
      </div>
      <div style="border:1px solid #9aa0a6;background:white;padding:14px;font-family:Consolas,monospace;line-height:2">
        <div>▾ 角色设定 <span style="font:12px Segoe UI;color:#68707a">文件夹</span></div>
        <div style="padding-left:28px">▤ 林的人物小传</div>
        <div>▤ 未命名文档</div>
      </div>
      <div style="margin-top:14px;color:#68707a;font-size:13px">“我的故事”显示在页面标题里，树中只放用户能创建、移动和删除的节点。</div>
    </div>
    <div class="card-body"><h3>B · 不显示作品根节点</h3><p>作品仍是树的容器，但不伪装成一项可管理内容。</p></div>
  </div>
</div>
