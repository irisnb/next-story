version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    # 大版本换代由用户手动主导，不自动递单（见 ci-pipeline 规格 Dependabot 更新策略）。
    ignore:
      - update-types: ["version-update:semver-major"]
    groups:
      npm-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 2

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "monthly"
    ignore:
      - update-types: ["version-update:semver-major"]
    groups:
      cargo-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 2
