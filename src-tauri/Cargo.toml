[package]
name = "next-story"
version = "0.1.0"
description = "Next Story - 剧本写作桌面编辑器"
authors = ["Next Story Team"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "next_story_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.6.3", features = [] }

[dependencies]
tauri = { version = "~2.11.5", features = [] }
tauri-plugin-dialog = "~2.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
reqwest = { version = "0.12", features = ["json"] }
keyring = { version = "~3.6.3", features = ["apple-native", "windows-native", "async-secret-service", "crypto-rust", "tokio"] }
open = "5"
# 生成真正的 Office Open XML `.docx`（docx-rs 0.4.22，MIT；换自已停更的 docx 1.1.2，
# 见 change swap-docx-and-split-js-bundle）。不嵌图：关默认 image feature，
# XML 渲染与 zip 打包核心路径不依赖它；精确锁版，升级经 Dependabot 递单人工审。
docx-rs = { version = "=0.4.22", default-features = false }
# P2-12 锁回收：作品锁 guard 需自持锁所有权（`lock_arc` / `ArcMutexGuard`），
# 须启用 `arc_lock` feature；parking_lot 0.12.5 已在依赖树内（tauri 生态传递引入），
# 提为直接依赖不引入新的外部 crate 或新版本。
parking_lot = { version = "0.12", features = ["arc_lock"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# 测试中解包生成的 .docx（zip 容器）以校验内容；与 docx-rs 内部 zip 同为 8.x 线，
# 只开 deflate（关默认 features 顺带把 time 0.1 挡在 dev 树外）。
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
