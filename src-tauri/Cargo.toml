[package]
name = "next-story"
version = "0.1.0"
description = "Next Story - 剧本写作桌面编辑器"
authors = ["Next Story Team"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "next_story_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.6.3", features = [] }

[dependencies]
tauri = { version = "~2.11.5", features = [] }
tauri-plugin-dialog = "~2.7.1"
# 应用单实例：重复启动不建窗口、立即退出并聚焦已有主窗口（enforce-single-instance）。
# 锁 2.4.5：最新 2.5.0 依赖 tauri ^2.12，与当前 ~2.11.5 冲突；tauri 升 2.12 后随升。
tauri-plugin-single-instance = "~2.4.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
reqwest = { version = "0.12", features = ["json"] }
keyring = { version = "~3.6.3", features = ["apple-native", "windows-native", "async-secret-service", "crypto-rust", "tokio"] }
open = "5"
# 生成真正的 Office Open XML `.docx`（docx-rs 0.4.22，MIT；换自已停更的 docx 1.1.2，
# 见 change swap-docx-and-split-js-bundle）。不嵌图：关默认 image feature，
# XML 渲染与 zip 打包核心路径不依赖它；精确锁版，升级经 Dependabot 递单人工审。
docx-rs = { version = "=0.4.22", default-features = false }
# Word 导入（add-word-import）解压防护预扫描：docx-rs 内部自行解压、无法注入逐
# 条目限额，调用 read_docx 前用 zip 流式预扫描执行单条目与总量上限。zip 已是
# docx-rs 的传递依赖（同一棵 8.x 树），提为直接依赖不引入新版本；只开 deflate。
zip = { version = "8.6", default-features = false, features = ["deflate"] }
# Word 导入内容哈希（预览-提交一致性校验）。sha2 0.10 已在依赖树内（reqwest
# 传递引入），提为直接依赖不引入新的外部 crate 或新版本。
sha2 = "0.10"
# P2-12 锁回收：作品锁 guard 需自持锁所有权（`lock_arc` / `ArcMutexGuard`），
# 须启用 `arc_lock` feature；parking_lot 0.12.5 已在依赖树内（tauri 生态传递引入），
# 提为直接依赖不引入新的外部 crate 或新版本。
parking_lot = { version = "0.12", features = ["arc_lock"] }
# Markdown 导入（add-markdown-import）解析：pulldown-cmark 事件流单遍映射到
# 自家语法；0.13.x 活跃维护（2026-05 发布 0.13.4），传递依赖仅
# bitflags/memchr/unicase；选项启用 TABLES/STRIKETHROUGH/TASKLISTS/FOOTNOTES。
pulldown-cmark = "0.13"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# 测试中解包生成的 .docx（zip 容器）以校验内容；zip 已提为直接依赖（Word 导入
# 预扫描），此处不再重复声明。

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
