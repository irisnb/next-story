name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sidecar/package-lock.json

      # tauri.conf.json 把 ../sidecar/node-runtime 声明为打包资源，Tauri 构建脚本
      # 在任何 cargo 编译前都校验该路径存在。该运行时有意不入库（.gitignore），
      # 由 scripts/vendor-node.ps1 在打包机上按需下载（仅支持 Windows）。
      # CI 只跑测试与检查、不打包安装包，用占位目录满足 cargo 的存在性校验即可；
      # 不伪造 node.exe，真实打包仍须通过 beforeBuildCommand 中的 package:check。
      - name: Placeholder for vendored node runtime
        run: |
          mkdir -p sidecar/node-runtime
          echo "CI placeholder; real runtime is vendored on the packaging machine." > sidecar/node-runtime/README.md

      # tauri.conf.json 的另一样打包资源 ../sidecar/node_modules/ 不入库，
      # 但有 sidecar/package-lock.json，按锁文件安装真实内容（DSH SDK）。
      - name: Install sidecar dependencies
        run: npm ci
        working-directory: sidecar

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 本地与双平台 CI 共用唯一门禁集合，科目与顺序只在 package.json 维护。
      # check 先构建前端再编译 Rust，满足 generate_context! 对前端产物的要求。
      - name: Run unified checks
        run: npm run check

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sidecar/package-lock.json

      # 同 Linux 作业：占位目录仅满足 cargo 资源检查，不伪造 node.exe；
      # CI 不打包，真实打包由 package:check 检查完整资源。sidecar 按锁文件安装。
      - name: Placeholder for vendored node runtime
        run: |
          New-Item -ItemType Directory -Force sidecar/node-runtime | Out-Null
          Set-Content sidecar/node-runtime/README.md "CI placeholder; real runtime is vendored on the packaging machine."

      - name: Install sidecar dependencies
        run: npm ci
        working-directory: sidecar

      - name: Install frontend dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 本地与双平台 CI 共用唯一门禁集合，科目与顺序只在 package.json 维护。
      # check 先构建前端再编译 Rust，满足 generate_context! 对前端产物的要求。
      - name: Run unified checks
        run: npm run check
