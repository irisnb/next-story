[package]
name = "next-story"
version = "0.1.0"
description = "Next Story - 剧本写作桌面编辑器"
authors = ["Next Story Team"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "next_story_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.6.3", features = [] }

[dependencies]
tauri = { version = "~2.11.5", features = [] }
tauri-plugin-dialog = "~2.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
reqwest = { version = "0.13", features = ["json"] }
keyring = { version = "~3.6.3", features = ["apple-native", "windows-native", "async-secret-service", "crypto-rust", "tokio"] }
open = "5"
# 生成真正的 Office Open XML `.docx`（MIT 许可，见 design.md 决策 1）。
docx = "1.1.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# 测试中解包生成的 .docx（zip 容器）以校验内容；docx 依赖已引入同版本 zip。
zip = "0.5"

# docx 1.1.2 经 strong-xml 0.5.0 依赖 jetscii ^0.4.4；crates.io 上的 jetscii 0.4.4
# 在 Rust ≥1.51 上因「generic parameters may not be used in const operations」无法
# 编译，而 strong-xml 0.5.0 的 ^0.4.4 约束按 semver 排除了已修复的 0.5.x，无法用
# 纯 crates.io 配置解决。此处用仓库内 vendored 副本打补丁：内容为 jetscii 0.5.3
# （已修复且 API 与 strong-xml 用法兼容），仅把版本号标为 0.4.4 以满足要求。
# 来源、许可证与维护说明见 vendor/jetscii-0.4.4-compat/README.md。
[patch.crates-io]
jetscii = { path = "vendor/jetscii-0.4.4-compat" }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
