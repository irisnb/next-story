<main id="boards"></main><div class="notice" role="status" hidden></div><footer class="end">评审说明：页顶「眯眼对照」只用于检查视觉层级。卡片快捷窗水平右侧邻接、垂直固定居中，尺寸统一；其他模块沿用原定位，无模态遮罩。完整详情占满导图内容区，正文普通页面滚动。业务转入只作本地演示。</footer>

function detail(){return `<section class="detail-panel" aria-label="反差与反转卡片检视"><section class="detail-section"><h4>身份</h4><dl class="identity"><dt>卡名</dt><dd>反差与反转</dd><dt>插槽</dt><dd>要求类</dd><dt>卡片版本</dt><dd>第2版</dd><dt>所属链路版本</dt><dd>情节探索 · 第3版 · 当前启用</dd></dl></section><section class="detail-section"><h4>何时用</h4><p class="change"><strong>适用</strong>　探索情节可能性时。</p><p class="change"><strong>不适用</strong>　只讨论台词情绪时，不主动把问题引向反转。</p></section><section class="detail-section"><h4>怎么做 · 完整正文（设计示例）</h4><div class="body-copy"><p>用户在探索情节可能性时，可以从人物预期与实际结果、表面关系与真实意图之间的反差出发，提出与当前问题有关的情节可能。先说明你依据了哪些已知内容；材料不足时，明确哪些只是暂时假设。</p><p>反转只是可选角度，不是故事必须达到的目标。提出可能性时，说明它可能改变什么、又需要哪些条件支撑；不要为了意外而否定已给出的角色动机，也不要将某个方向说成唯一正确的选择。</p><p>用户只讨论台词中的情绪、语气或表达时，围绕这个问题回应，不主动要求增加反转。问题同时涉及情节与台词时，只在与情节相关的部分使用这一角度。</p><p>把观察、假设和候选分清，让用户决定是否采用。所有候选只留在对话中，不写入或改动用户文档。</p></div></section><section class="detail-section"><h4>本版变化 · 相对卡片第1版</h4><p class="change">补充「只讨论台词情绪时不主动引向反转」的边界；增加提出情节可能性时说明支撑条件的要求。保留反差与反转作为可选角度。</p></section><section class="detail-section"><h4>试问记录</h4><p class="record-meta">归属：情节探索 · 第3版 / 反差与反转 · 第2版<br>以下为排版示例，非真实运行证据。</p><div class="trial-question">本版试问：守门人明明认识来客，却说不认识，还可以有哪些情节可能？</div><div class="comparison"><div><strong>带卡结果 · 示例全文</strong>一种可能：否认相识是在保护来客；另一种可能：他认识的是来客借用的身份。前者需要有旁人在场或被监视的条件，后者需要身份误认的线索。这些是假设，现有材料还不能判断哪一种更适合。</div><div><strong>不带卡结果 · 示例全文</strong>他可能有意隐瞒旧关系，也可能在试探来客，或担心承认相识会带来麻烦。可以从他此刻想保护什么、害怕失去什么来继续想。</div></div><p class="feedback"><strong>用户反馈 · 示例</strong><br>我想保留“保护来客”的可能，但不想每次讨论都变成身份谜题。</p><details><summary class="text-button">对照：第4版草稿没有试问时</summary><div class="no-trial"><strong>尚无试问记录</strong><p>情节探索 · 第4版草稿 / 反差与反转 · 第3版。第3版链路的结果不计作本版试问。</p></div></details></section><footer class="detail-actions"><button type="button">请制作助手修改</button></footer></section>`}
const scenes=[{id:'overview',title:'导图 · 总览',note:'三区同构堆叠在左；自定义要求定高滚动，图区中心不变。'},{id:'card',title:'快捷小窗 · 统一位置',note:'点卡片／点固定底座／点每轮动态：都在同一位置，统一450 × 330；仅内容和可操作性不同。',panel:'card'},{id:'full',title:'全页详情 · 完整阅读',note:'卡片显示五项与底部三操作；底座、每轮动态沿用同一全页形式，仅显示只读说明。',full:true},{id:'draft',title:'第3版启用，查看第4版草稿',note:'启用对象、查看对象与制作对象分离。'}];
function graph(id){return `<div class="graph" aria-label="零件、组装、输出的组成关系"><svg class="wires" viewBox="0 0 840 440" aria-hidden="true"><defs><marker id="arrow-${id}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L7 4 L1 7" style="fill:none;stroke:#8a9a7e;stroke-width:1.4"/></marker></defs><path marker-end="url(#arrow-${id})" d="M370 128 H376 Q382 128 382 142 V206 Q382 220 398 220 H490"/><path marker-end="url(#arrow-${id})" d="M370 298 C410 298 435 220 490 220"/><path marker-end="url(#arrow-${id})" d="M370 388 C430 388 420 220 490 220"/><path marker-end="url(#arrow-${id})" d="M588 220 H673"/></svg><section class="variable-region" aria-label="自定义要求" data-zone="custom"><header class="variable-heading"><h4><button class="zone-trigger" data-panel="custom" aria-expanded="false" aria-controls="panel-${id}">自定义要求</button></h4><span>可改 · 可加</span></header><div class="zone-scroll" tabindex="0" aria-label="自定义要求内容，可滚动"><section class="card-group" aria-label="要求类插槽"><div class="group-title"><h4>要求类插槽 <span>· 2 张卡</span></h4></div><div class="slot-list"><button class="card-node" data-panel="card" aria-expanded="false" aria-controls="panel-${id}">反差与反转<span aria-hidden="true">详情</span></button><button class="card-node" data-panel="second" aria-expanded="false" aria-controls="panel-${id}">保留不同可能<span aria-hidden="true">详情</span></button></div><button class="ghost" data-panel="add" aria-expanded="false" aria-controls="panel-${id}">＋ 添加要求卡</button></section></div></section><button class="source-node base-node" data-panel="base" aria-expanded="false" aria-controls="panel-${id}"><span class="zone-heading"><strong>固定底座</strong><span>共用 · 只读</span></span><span class="zone-items"><span>红线</span><span>骨</span><span>工具</span><span>材料规则</span></span></button><button class="source-node auto-node" data-panel="dynamic" aria-expanded="false" aria-controls="panel-${id}"><span class="zone-heading"><strong>每轮动态</strong><span>自动</span></span><span class="zone-items"><span>问题</span><span>材料</span><span>入口</span></span></button><div class="assembly-node">组装</div><div class="output-node" aria-label="提示词，组装输出示意"><strong>提示词</strong><span>组装输出</span></div></div><div class="graph-footer"><span>修改、删除、添加均进入制作对话。</span><span>箭头只表示流向组装，不表示卡片执行顺序。</span></div>`}
function library(draft){return `<aside class="library"><h3>链路库</h3><div class="library-row selected"><span class="library-name">情节探索<span class="state-dot on" role="img" aria-label="启用中" title="第3版启用中"></span></span><p class="selected-note">查看第${draft?4:3}版${draft?'草稿':''} · 2卡</p></div><div class="library-row"><span class="library-name">人物讨论<span class="state-dot" role="img" aria-label="草稿" title="草稿"></span></span></div><p class="library-note">选择只改变查看。</p></aside>`}
function page(s){const draft=s.id==='draft';return `<section class="sheet" id="${s.id}"><header class="caption"><h2>${s.title}</h2><p>${s.note}</p></header><div class="viewport"><div class="app"><div class="nav"><span class="brand">Next Story</span><span>写作</span><span>文件管理</span><span>设置</span><span class="nav-current">制作模块</span></div><div class="status"><div><strong>当前链路：情节探索 · 第3版｜所有作品共用</strong><small>从下一轮开始使用；正在生成的回复沿用发起时的版本。</small></div><button data-action="停用链路">停用</button></div><div class="tabs"><span class="tab active">导图</span><span class="tab">制作对话<span class="target">正在制作：情节探索 · 第4版草稿 / 反差与反转</span></span></div><div class="layout">${library(draft)}<article class="content"><p class="eyebrow">正在查看</p><header class="head"><h3>情节探索 · 第${draft?4:3}版${draft?'草稿':''}</h3><span class="badge ${draft?'draft':''}">${draft?'尚未启用':'当前启用'}</span><button data-action="查看版本记录">版本记录</button></header><p class="disclaimer">展示链路的组装结构与适用条件，不代表 AI 内部思考过程。</p><div class="graph-view">${graph(s.id)}</div><div class="full-view" hidden></div><div class="making-demo" hidden></div><aside class="reading-notes"><strong>阅读说明</strong><p>箭头只表示流向组装，不表示卡片执行顺序</p><p>展示链路的组装结构与适用条件，不代表 AI 内部思考过程。</p></aside><div class="panel-host" id="panel-${s.id}" hidden></div><div class="actionbar"><span>${draft?'启用对象是整个链路版本。第4版草稿尚未启用；启用后所有作品下一轮开始使用。':'启用对象是整个链路版本。'}</span>${draft?'<button class="primary" data-action="启用情节探索第4版">启用「情节探索 · 第4版」</button>':''}</div></article></div></div></div><p class="annotation">${s.panel?'快捷窗位置和尺寸固定；关闭后焦点返回原模块。':'左侧零件区可点击查看详情；组装、输出与线条不响应点击。'}</p></section>`}
const baseCopy=`<div class="readonly-copy"><p><strong>红线</strong><br>AI 不改写你的文档；回复只是临时材料，判断权始终在你手里。</p><p><strong>骨（底线立场）</strong><br>AI 只提观察、问题与可能性，不替你判断创意高低，不把假设当成事实。</p><p><strong>工具</strong><br>阅读、检索等公共能力对所有链路一样可用，不按链路分档。</p><p><strong>材料规则</strong><br>AI 只按你授权的范围读取作品材料；链路不改变任何读取授权。</p></div>`;
const dynamicCopy=`<div class="readonly-copy"><p><strong>你的问题</strong><br>来自本轮提问。</p><p><strong>当轮材料</strong><br>按既有取材、可见性与授权规则准备，自动加入不等于任意读取作品。</p><p><strong>入口</strong><br>说明本轮从直接提问还是选区召唤发起。</p><p class="note">这些随每轮现场变化，由系统自动加入，不是可配置的链路要求。</p></div>`;

function actions(name){return '<footer class="panel-actions"><button data-make="修改" data-name="'+name+'">请制作助手修改</button><button data-make="删除" data-name="'+name+'">请制作助手删除</button><button data-make="添加" data-name="要求类">请制作助手添加要求卡</button></footer>'}
function cardName(type){return type==='second'?'保留不同可能':'反差与反转'}
function versionDetail(section){let body=detail();const scratch=document.createElement('div');scratch.innerHTML=body;scratch.querySelector('.detail-actions')?.remove();if(section.id==='draft'){scratch.querySelectorAll('.identity dd')[2].textContent='第3版';scratch.querySelectorAll('.identity dd')[3].textContent='情节探索 · 第4版草稿 · 尚未启用';const parts=scratch.querySelectorAll('.detail-section');parts[3].innerHTML='<h4>本版变化</h4><p>本视觉稿沿用已认可正文，未拟定新调整。</p>';parts[4].innerHTML='<h4>试问记录</h4><p>尚无试问记录。</p>'}return scratch.innerHTML}
function openPanel(section,type){const host=section.querySelector('.panel-host');let title='',body='',footer='';const name=cardName(type);if(type==='custom'){title='自定义要求 · 可改 · 可加';body='<p>要求类插槽 · 2 张卡</p><p class="reading-help">反差与反转、保留不同可能。</p><p>通过制作对话调整卡片或添加要求。选择具体卡片后查看它的完整详情。</p>';footer='<footer class="panel-actions"><button data-make="添加" data-name="要求类">请制作助手添加要求卡</button></footer>'}else if(type==='base'){title='固定底座 · 共用 · 只读';body=baseCopy+'<button class="quick-open" data-full="base">打开完整详情</button>'}else if(type==='dynamic'){title='每轮动态 · 自动';body=dynamicCopy+'<button class="quick-open" data-full="dynamic">打开完整详情</button>'}else if(type==='add'){title='要求类 · 添加要求卡';body='<p>在要求类插槽中加入一张卡。</p><p class="reading-help">通过制作对话说明你希望增加什么要求；导图不直接编辑。</p>';footer='<footer class="panel-actions"><button data-make="添加" data-name="要求类">请制作助手添加要求卡</button></footer>'}else{title=name;body='<p class="quick-meta">要求类 · '+(section.id==='draft'?'第4版草稿 · 尚未启用':'情节探索 · 第3版')+'</p><p>'+(type==='card'?'从人物预期与实际结果、表面关系与真实意图之间的反差，探索情节可能。':'示例卡简称；完整正文尚未拟定。')+'</p><p class="reading-help">'+(type==='card'?'适用：探索情节可能性。只讨论台词情绪时不主动引向反转。':'用于比较不同卡片的统一快捷窗位置。')+'</p><button class="quick-open" data-full="'+type+'">打开完整详情</button>';footer=actions(name)}host.innerHTML='<section class="panel" role="region" aria-label="'+title+'"><header class="panel-head"><h4>'+title+'</h4><button data-close>关闭详情</button></header><div class="panel-body" tabindex="0">'+body+'</div>'+footer+'</section>';section.querySelector('.graph').appendChild(host);host.hidden=false;host.dataset.source=type;section.querySelectorAll('[data-panel]').forEach(b=>b.setAttribute('aria-expanded',String(b.dataset.panel===type)))}
function showFull(section,type='card'){const full=section.querySelector('.full-view');section.dataset.fullType=type;section.querySelector('.graph-view').hidden=true;const readonly=type==='base'||type==='dynamic';const name=type==='base'?'固定底座':type==='dynamic'?'每轮动态':cardName(type);const body=type==='base'?baseCopy:type==='dynamic'?dynamicCopy:type==='card'?versionDetail(section):'<p class="reading-help">保留不同可能：本次只有简称示例，未拟定完整正文、变化和试问记录。</p>';full.innerHTML='<header class="full-top"><div><p class="eyebrow">'+(readonly?(type==='base'?'共用 · 只读':'自动'):'要求类')+' / '+name+'</p><h3>完整详情</h3></div><button data-back>返回导图 · 快捷详情</button></header>'+body+(readonly?'':actions(name));full.hidden=false}

document.getElementById('boards').innerHTML=scenes.map(page).join('');scenes.forEach(s=>{const section=document.getElementById(s.id);if(s.panel)openPanel(section,s.panel);if(s.full)showFull(section)});
let noticeTimer;
document.addEventListener('click',e=>{const zone=e.target.closest('[data-zone]');if(zone&&!e.target.closest('button')){openPanel(zone.closest('.sheet'),'custom');return}
const fullButton=e.target.closest('[data-full]');if(fullButton){showFull(fullButton.closest('.sheet'),fullButton.dataset.full);return}
const back=e.target.closest('[data-back]');if(back){const s=back.closest('.sheet');s.querySelector('.full-view').hidden=true;s.querySelector('.graph-view').hidden=false;openPanel(s,s.dataset.fullType||'card');return}
const make=e.target.closest('[data-make]');if(make){const s=make.closest('.sheet');s.querySelector('.graph-view').hidden=true;s.querySelector('.full-view').hidden=true;s.querySelector('.panel-host').hidden=true;const area=s.querySelector('.making-demo');area.hidden=false;area.innerHTML='<p class="eyebrow">制作对话 · 转入示意</p><h3>'+make.dataset.make+'：'+make.dataset.name+'</h3><p>已带入操作和目标，等待你在制作对话中说明要求。</p><textarea aria-label="制作要求" placeholder="在这里说明你想怎么调整……"></textarea><p class="reading-help">视觉稿不调用 AI、不保存或执行更改。</p><button data-return-map>返回导图</button>';s.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.textContent.startsWith('制作对话')));return}
const returnMap=e.target.closest('[data-return-map]');if(returnMap){const s=returnMap.closest('.sheet');s.querySelector('.making-demo').hidden=true;s.querySelector('.graph-view').hidden=false;s.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.textContent==='导图'));return}
const node=e.target.closest('[data-panel]');if(node){openPanel(node.closest('.sheet'),node.dataset.panel);return}const close=e.target.closest('[data-close]');if(close){const host=close.closest('.panel-host'),section=close.closest('.sheet'),source=host.dataset.source;host.hidden=true;section.querySelectorAll('[data-panel]').forEach(b=>b.setAttribute('aria-expanded','false'));section.querySelector('[data-panel="'+source+'"]').focus({preventScroll:true});return}const action=e.target.closest('[data-action]');if(action){const box=document.querySelector('.notice');box.textContent='静态视觉稿：'+action.dataset.action+'。本稿不执行业务操作。';box.hidden=false;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>box.hidden=true,4000)}});
document.querySelector('.blur-toggle').addEventListener('click',e=>{const active=document.body.classList.toggle('squint');e.currentTarget.setAttribute('aria-pressed',String(active));e.currentTarget.textContent=active?'恢复清晰':'眯眼对照 · 7px'});
</script></body></html>
